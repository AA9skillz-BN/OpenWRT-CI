# SPDX-License-Identifier: MIT
# AP3000M + FM350-GL (USB 3.0 RNDIS) 低延迟高吞吐内核调优
#
# TCP 拥塞控制由 TurboACC 保存和应用，避免 sysctl 重载覆盖用户选择。

# 队列调度：fq_codel 隔离稀疏交互小包（DNS/SYN/游戏/SSH）与大流量下载
net.core.default_qdisc=fq_codel

# 16MB 套接字窗口：按 1GB RAM 充裕内存配置，满足 5G NR 100MHz 高带宽时延积
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.core.rmem_default=262144
net.core.wmem_default=262144
net.ipv4.tcp_rmem=4096 131072 16777216
net.ipv4.tcp_wmem=4096 65536 16777216
net.ipv4.udp_rmem_min=16384
net.ipv4.udp_wmem_min=16384

# USB 3.0 RNDIS 突发多，加大队列与单轮 NAPI 软中断预算，消除高吞吐下 softnet time_squeeze
net.core.netdev_max_backlog=4096
net.core.netdev_budget=600
net.core.netdev_budget_usecs=20000
net.core.somaxconn=4096

# RFS 全局流表（配合每队列 rps_flow_cnt 提升双核缓存局部性）
net.core.rps_sock_flow_entries=32768

# 5G 蜂窝空口 PDCP 重排 + nft_flow_offload 快转必开：避免有效乱序/快转包被判 INVALID 丢弃导致卡顿
net.netfilter.nf_conntrack_tcp_be_liberal=1

# 交互低延迟：禁止短暂停顿后重置 BBR 拥塞窗口，开启 TFO 与低未发水位，关闭易受蜂窝中间件干扰的 ECN
net.ipv4.tcp_slow_start_after_idle=0
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_fastopen=3
net.ipv4.tcp_notsent_lowat=16384
net.ipv4.tcp_tw_reuse=1
net.ipv4.tcp_ecn=0
net.ipv4.tcp_sack=1
net.ipv4.tcp_dsack=1

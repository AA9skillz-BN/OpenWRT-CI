# SPDX-License-Identifier: MIT
# AP3000M 的 TCP/队列调优（针对 FM350 的 USB-RNDIS 上游）
#
# BBR 需要 kmod-tcp-bbr（已随固件编入，AUTOLOAD 会自动 modprobe tcp_bbr）。
# 若该模块缺失，本文件里的 tcp_congestion_control 会写失败并被内核忽略，
# 其余参数仍然生效。

# 拥塞控制：BBR 对「弱信号 + 抖动 + 缓升」的 5G 链路比 cubic 明显更稳
net.ipv4.tcp_congestion_control=bbr

# 队列：fq_codel 是所有 OpenWrt 镜像自带的默认 qdisc（无需额外 kmod）
net.core.default_qdisc=fq_codel

# 缓冲：按 1GB RAM 给，够 BDP≈40ms×500Mbps 的窗口
net.core.rmem_max=8388608
net.core.wmem_max=8388608
net.ipv4.tcp_rmem=4096 87380 8388608
net.ipv4.tcp_wmem=4096 65536 8388608

# USB 网卡突发多，默认 1000 的 backlog 容易丢
net.core.netdev_max_backlog=2000

# 路径 MTU 发现被中间设备吃掉时自动探测，避免黑洞
net.ipv4.tcp_mtu_probing=1

# 小请求（DNS/HTTP 头）延迟更低
net.ipv4.tcp_fastopen=3
net.ipv4.tcp_notsent_lowat=16384

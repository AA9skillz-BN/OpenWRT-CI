# SPDX-License-Identifier: MIT
# Cudy TR3000 512MB 单机型固件（与 AP3000M 同构：复用公用核心 WRT-CORE.yml）
#
# 地基：.github/workflows/WRT-CORE.yml
# 专属文件：
#   Config/TR3000-512.txt                     单机型配置
#   Scripts/TR3000-512/patch-layout.sh        512MB 硬改机 UBI 布局
#   Profiles/TR3000-512.json、Profiles/packages.lock.json  固定 commit 插件
#   Scripts/TR3000-512/private.sh             钩子总入口（分区/插件/首启/F50）
#   Files/TR3000-512/                         首启配置 + F50 即插即用
#   docs/TR3000-512.md
#
# 说明：默认源码 VIKINGYFY/immortalwrt 的 owrt 分支（MTK 专用，实际内核随上游），
#       保持与原独立工作流一致的基座，避免换基座带来的未知回归。
#       需要跟上上游时可手动把 SOURCE 填 immortalwrt/immortalwrt、BRANCH 填 master。

name: TR3000

on:
  # 手动编译
  workflow_dispatch:
    inputs:
      SOURCE:
        description: '源码仓库（owner/repo），默认 VIKINGYFY/immortalwrt'
        required: false
        default: 'VIKINGYFY/immortalwrt'
        type: string
      BRANCH:
        description: '源码分支，默认 owrt（VIKINGYFY 的 MTK 专用分支）'
        required: false
        default: 'owrt'
        type: string
      PACKAGE:
        description: '手动追加插件包，多个请用\n符号隔开。'
        required: false
        type: string
      BUILD_ONLY:
        description: '编译并校验固件，只上传 Artifact，不发布 Release。'
        default: false
        required: false
        type: boolean
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

#CI权限
permissions:
  contents: write
  actions: write

#同一时间只跑一个 TR3000 构建
concurrency:
  group: tr3000-${{ github.ref }}
  cancel-in-progress: false

#CI任务
jobs:
  tr3000:
    name: TR3000-${{ inputs.SOURCE }}-${{ inputs.BRANCH }}
    strategy:
      fail-fast: false
      matrix:
        # 只编 TR3000 一款，变体在 Config/TR3000-512.txt 内调整
        CONFIG: [TR3000-512]

    #调用公用编译核心 WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{ matrix.CONFIG }}
      WRT_PUBLISH: ${{ !inputs.BUILD_ONLY }}
      WRT_PROFILE: TR3000-512
      #默认主题
      WRT_THEME: aurora
      #默认主机名
      WRT_NAME: TR3000
      #默认WIFI名称
      WRT_SSID: TR3000
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.6.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{ inputs.SOURCE || 'VIKINGYFY/immortalwrt' }}.git
      #源码分支
      WRT_BRANCH: ${{ inputs.BRANCH || 'owrt' }}
      #源码名称
      WRT_SOURCE: ${{ inputs.SOURCE || 'VIKINGYFY/immortalwrt' }}
      #插件调整
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      #仅输出配置文件
      WRT_TEST: ${{ inputs.TEST || false }}

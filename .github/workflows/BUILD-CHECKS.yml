name: Build logic checks

on:
  push:
    paths:
      - '.github/**'
      - 'Profiles/**'
      - 'Config/**'
      - 'Scripts/*.sh'
      - 'Scripts/TR3000-512/**'
      - 'Scripts/AP3000M/**'
      - 'Files/TR3000-512/**'
      - 'Scripts/C8-688/**'
      - 'Files/C8-688/**'
  pull_request:
    paths:
      - '.github/**'
      - 'Profiles/**'
      - 'Config/**'
      - 'Scripts/*.sh'
      - 'Scripts/TR3000-512/**'
      - 'Scripts/AP3000M/**'
      - 'Files/TR3000-512/**'
      - 'Scripts/C8-688/**'
      - 'Files/C8-688/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workflow test dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Install image and runtime validation tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends device-tree-compiler u-boot-tools squashfs-tools libjson-c-dev cmake jq util-linux
      - name: Build pinned ucode test interpreter
        shell: bash
        run: |
          # Same ucode revision as the locked official source's package recipe.
          mkdir -p "$RUNNER_TEMP/ucode-source"
          curl -fsSL --retry 3 https://github.com/ucode-lang/ucode/archive/aabdeb4f5060c91c5929bf6d7af745c6aabf5ec5.tar.gz |
            tar -xz -C "$RUNNER_TEMP/ucode-source" --strip-components=1
          cmake -S "$RUNNER_TEMP/ucode-source" -B "$RUNNER_TEMP/ucode-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/ucode-build" --target ucode -j2
          echo "UCODE_TEST_BIN=$RUNNER_TEMP/ucode-build/ucode" >> "$GITHUB_ENV"
      - name: Test build gates, device runtime, OTA and actual images
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Check LuCI JavaScript syntax
        run: |
          node --check Scripts/AP3000M/luci-app-ap3000m-ota/htdocs/luci-static/resources/view/ap3000m-ota/overview.js
          node --check Scripts/C8-688/luci-app-c8-688-ota/htdocs/luci-static/resources/view/c8-688-ota/overview.js
          node .github/scripts/test_c8_ota_ui.js
      - name: Check shell syntax
        run: python3 .github/scripts/check-shell-syntax.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - name: Validate workflow syntax and expressions
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=

name: Auto-Clean

on:
  schedule:
    - cron: '21 21 * * *'
  workflow_dispatch:
    inputs:
      APPLY:
        description: '执行删除；不勾选则只预览清理列表'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-cleanup-per-model
  cancel-in-progress: false

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Preview or clean releases per model
        env:
          APPLY: ${{ github.event_name == 'schedule' || inputs.APPLY }}
        run: |
          if [ "$APPLY" = true ]; then
            python3 Scripts/Release/cleanup.py --apply
          else
            python3 Scripts/Release/cleanup.py
          fi

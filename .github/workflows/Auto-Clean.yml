# SPDX-License-Identifier: MIT
# Keep three stable and three preview releases per device; reclaim owned failed drafts.
name: Auto-Clean

on:
  schedule:
    # Hong Kong time 05:21
    - cron: '21 21 * * *'
  workflow_dispatch:
    inputs:
      APPLY:
        description: '执行删除：每型号/渠道保留三版，回收超过一天的流水线失败草稿；默认仅预览'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: release-cleanup-per-model
  cancel-in-progress: false

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPLY: ${{ github.event_name == 'schedule' || inputs.APPLY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retain releases and reclaim verified failed drafts
        shell: bash
        run: |
          if [ "$APPLY" = true ]; then
            python3 .github/scripts/release-cleanup.py --apply
          else
            python3 .github/scripts/release-cleanup.py
          fi

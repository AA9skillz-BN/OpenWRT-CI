# SPDX-License-Identifier: MIT
# Keep three stable and three preview releases per recognized device.
name: Auto-Clean

on:
  schedule:
    # Hong Kong time 05:21
    - cron: '21 21 * * *'
  workflow_dispatch:
    inputs:
      APPLY:
        description: '勾选执行删除；每型号正式/测试版分别保留三版，默认仅预览'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-cleanup-per-model
  cancel-in-progress: false

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPLY: ${{ github.event_name == 'schedule' || inputs.APPLY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Keep latest three releases per model
        shell: bash
        run: |
          if [ "$APPLY" = true ]; then
            python3 .github/scripts/release-cleanup.py --apply
          else
            python3 .github/scripts/release-cleanup.py
          fi

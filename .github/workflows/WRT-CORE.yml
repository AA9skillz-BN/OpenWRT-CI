#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_PROFILE:
        description: 'Optional single-device contract in Profiles/'
        required: false
        default: ''
        type: string
      WRT_PUBLISH:
        description: 'Publish a validated release; false uploads firmware artifacts only'
        required: false
        default: true
        type: boolean
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_PROFILE: ${{inputs.WRT_PROFILE}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ${{ inputs.WRT_PROFILE != '' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
      device_cache_prefix: ${{steps.device-cache.outputs.prefix}}
      device_dl_key: ${{steps.device-cache.outputs.dl}}${{github.run_id}}-${{github.run_attempt}}
      device_ccache_key: ${{steps.device-cache.outputs.ccache}}${{github.run_id}}-${{github.run_attempt}}
      device_staging_key: ${{steps.device-cache.outputs.staging}}
      release_tag: ${{steps.initialize-values.outputs.release_tag}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -yqq update
          if [ -z "$WRT_PROFILE" ]; then
            sudo apt-get -yqq purge firefox
            sudo apt-get -yqq full-upgrade
            sudo apt-get -yqq autoremove --purge
            sudo apt-get -yqq autoclean
            sudo apt-get -yqq clean
          fi

          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates ccache clang \
            cmake cpio curl device-tree-compiler dos2unix file flex \
            g++-multilib gawk gcc-multilib genisoimage gettext git jq \
            libbpf-dev libclang-dev libdw-dev libelf-dev libncurses-dev libssl-dev lld \
            llvm ninja-build patch perl pkgconf python3 python3-cryptography \
            python3-dev python3-packaging python3-pyelftools python3-setuptools qemu-utils rsync swig \
            unzip wget xz-utils zlib1g-dev zstd

          sudo timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[^=_]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[^=_]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"
          WRT_WIFI=$(grep -oE 'WIFI-(YES|NO)$' <<< "${WRT_CONFIG^^}" || true); WRT_WIFI=${WRT_WIFI:-none}

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_DATE=$WRT_DATE"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_WIFI=$WRT_WIFI"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"
          # Reuse the same tag for device labels, packaging and publication.
          WRT_SAFE_BRANCH=${WRT_BRANCH//\//-}
          WRT_RELEASE_TAG="$WRT_CONFIG-${WRT_SOURCE%%/*}-$WRT_SAFE_BRANCH-$WRT_DATE-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -z "$WRT_PROFILE" ]; then
            WRT_RELEASE_TAG="$WRT_CONFIG-${WRT_SOURCE%%/*}-$WRT_BRANCH-$WRT_DATE"
          fi
          echo "WRT_RELEASE_TAG=$WRT_RELEASE_TAG" >> "$GITHUB_ENV"
          echo "release_tag=$WRT_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$WRT_PROFILE" ]; then
            test "$WRT_PROFILE" = "$WRT_CONFIG"
            test -f "Profiles/$WRT_PROFILE.json"
          fi

      - name: Clone Code
        id: clone-code
        run: |
          git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./wrt/

          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Restore Build Cache
        id: cache-restore
        if: ${{ !inputs.WRT_TEST && inputs.WRT_PROFILE == '' }}
        uses: actions/cache/restore@v4
        with:
          key: ${{env.WRT_CACHE_KEY}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Prepare Restored Build Cache
        if: ${{ !inputs.WRT_TEST && inputs.WRT_PROFILE == '' && steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "restored build cache: ${{steps.cache-restore.outputs.cache-matched-key}}"

      - name: Update Feeds
        run: |
          cd ./wrt/

          if [ -n "$WRT_PROFILE" ]; then
            # Config-only feed flags do not prevent feeds install/Kconfig parsing.
            for file in feeds.conf feeds.conf.default; do
              if [ -f "$file" ]; then
                sed -i -E '/^[^#][^[:space:]]*[[:space:]]+(video|pon_drivers|pon_userspace)[[:space:]]/d' "$file"
              fi
            done
          fi
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/

          if [ -n "$WRT_PROFILE" ]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/device-build.py" packages
          else
            bash "$GITHUB_WORKSPACE/Scripts/Packages.sh"
          fi
          bash "$GITHUB_WORKSPACE/Scripts/Handles.sh"
          bash "$GITHUB_WORKSPACE/.github/scripts/prepare-i2c-tools.sh"

      - name: Apply Device Source and Files
        if: ${{ inputs.WRT_PROFILE != '' }}
        working-directory: ./wrt
        run: bash "$GITHUB_WORKSPACE/Scripts/$WRT_PROFILE/private.sh"

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [ -n "$WRT_PROFILE" ]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/device-build.py" merge
          elif [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh
          $GITHUB_WORKSPACE/.github/scripts/prepare-build-host.sh

          make defconfig
          if [ -n "$WRT_PROFILE" ]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/device-build.py" check
          else
            make clean -j"$(nproc)"
          fi

      - name: Prepare Rust Toolchain
        if: ${{ !inputs.WRT_TEST || inputs.WRT_PROFILE != '' }}
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/prepare-rust.sh

      - name: Compute Device Cache Keys
        id: device-cache
        if: ${{ inputs.WRT_PROFILE != '' }}
        working-directory: ./wrt
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/device-build.py" cache

      - name: Restore Downloads
        if: ${{ !inputs.WRT_TEST && inputs.WRT_PROFILE != '' }}
        uses: actions/cache/restore@v4
        with:
          key: ${{steps.device-cache.outputs.dl}}${{github.run_id}}-${{github.run_attempt}}
          restore-keys: ${{steps.device-cache.outputs.dl}}
          path: ./wrt/dl

      - name: Restore Compiler Cache
        if: ${{ !inputs.WRT_TEST && inputs.WRT_PROFILE != '' }}
        uses: actions/cache/restore@v4
        with:
          key: ${{steps.device-cache.outputs.ccache}}${{github.run_id}}-${{github.run_attempt}}
          restore-keys: ${{steps.device-cache.outputs.ccache}}
          path: ./wrt/.ccache

      - name: Restore Exact Toolchain Cache
        id: device-staging
        if: ${{ !inputs.WRT_TEST && inputs.WRT_PROFILE != '' }}
        uses: actions/cache/restore@v4
        with:
          key: ${{steps.device-cache.outputs.staging}}
          path: |
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Refresh Runner Tool Links
        if: ${{ !inputs.WRT_TEST && inputs.WRT_PROFILE != '' }}
        working-directory: ./wrt
        run: |
          mkdir -p staging_dir/host/bin
          for tool in cargo rustc rustdoc; do
            test -x "$CI_RUST_ROOT/bin/$tool"
            ln -sfn "$CI_RUST_ROOT/bin/$tool" "staging_dir/host/bin/$tool"
          done
          export CCACHE_DIR="$PWD/.ccache"
          ccache --max-size=1G
          ccache --zero-stats

      - name: Download Packages
        id: download
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        id: compile
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          mkdir -p $GITHUB_WORKSPACE/build-reports
          make -j$(nproc) BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/parallel.tsv" || \
            make -j1 V=s BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/serial.tsv"

      - name: Verify and Package Device Firmware
        id: device-package
        if: ${{ !inputs.WRT_TEST && inputs.WRT_PROFILE != '' }}
        working-directory: ./wrt
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/device-build.py" package

      - name: Save Downloads
        if: ${{ !cancelled() && inputs.WRT_PROFILE != '' && steps.download.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          key: ${{steps.device-cache.outputs.dl}}${{github.run_id}}-${{github.run_attempt}}
          path: ./wrt/dl

      - name: Save Compiler Cache
        if: ${{ !cancelled() && inputs.WRT_PROFILE != '' && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          key: ${{steps.device-cache.outputs.ccache}}${{github.run_id}}-${{github.run_attempt}}
          path: ./wrt/.ccache

      - name: Save Exact Toolchain Cache
        if: ${{ !cancelled() && inputs.WRT_PROFILE != '' && steps.device-package.outcome == 'success' && steps.device-staging.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: ${{steps.device-cache.outputs.staging}}
          path: |
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Collect Build Reports
        if: ${{ !inputs.WRT_TEST && always() }}
        continue-on-error: true
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/collect-build-reports.sh

      - name: Upload Build Reports
        if: ${{ !inputs.WRT_TEST && always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-reports-${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{github.run_attempt}}
          path: ./build-reports/
          retention-days: 7

      - name: Save Build Cache
        if: ${{ !inputs.WRT_TEST && inputs.WRT_PROFILE == '' && success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        if: ${{ inputs.WRT_PROFILE == '' || inputs.WRT_TEST }}
        run: |
          cd ./wrt/ && mkdir ./upload/

          if [ -n "$WRT_PROFILE" ]; then
            cp .config "./upload/Config-$WRT_RELEASE_TAG.txt"
          else
            cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt
          fi

          if [[ "$WRT_TEST" != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Upload Configuration Preview
        if: ${{ inputs.WRT_PROFILE != '' && inputs.WRT_TEST }}
        uses: actions/upload-artifact@v4
        with:
          name: config-${{inputs.WRT_PROFILE}}-${{github.run_id}}-${{github.run_attempt}}
          path: ./wrt/upload/Config-*.txt
          if-no-files-found: error

      - name: Create Validated Draft Release
        id: device-release
        if: ${{ inputs.WRT_PROFILE != '' && !inputs.WRT_TEST && inputs.WRT_PUBLISH }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{env.WRT_RELEASE_TAG}}
          target_commitish: ${{github.sha}}
          draft: true
          fail_on_unmatched_files: true
          body_path: ./build-reports/release-notes.md
          files: ./wrt/upload/*

      - name: Publish Complete Device Release
        if: ${{ inputs.WRT_PROFILE != '' && !inputs.WRT_TEST && inputs.WRT_PUBLISH }}
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
          RELEASE_ID: ${{steps.device-release.outputs.id}}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false

      - name: Upload Validated Firmware Without Publishing
        if: ${{ inputs.WRT_PROFILE != '' && !inputs.WRT_TEST && !inputs.WRT_PUBLISH }}
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{inputs.WRT_PROFILE}}-${{github.run_id}}-${{github.run_attempt}}
          path: ./wrt/upload/*
          if-no-files-found: error
          retention-days: 7

      - name: Release Firmware
        if: ${{ inputs.WRT_PROFILE == '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            全系带开源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

  device-cache-rollover:
    name: Retain device cache generations
    needs: core
    if: ${{ !inputs.WRT_TEST && inputs.WRT_PROFILE != '' && needs.core.result == 'success' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: device-cache-${{github.ref}}-${{inputs.WRT_PROFILE}}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      DEVICE_CACHE_PREFIX: ${{needs.core.outputs.device_cache_prefix}}
      DEVICE_DL_KEY: ${{needs.core.outputs.device_dl_key}}
      DEVICE_CCACHE_KEY: ${{needs.core.outputs.device_ccache_key}}
      DEVICE_STAGING_KEY: ${{needs.core.outputs.device_staging_key}}
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/roll-device-cache.py

  cache-rollover:
    name: Roll cache generations
    needs: core
    if: ${{ !inputs.WRT_TEST && inputs.WRT_PROFILE == '' && needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
    steps:
      - name: Roll Build Cache
        run: |
          set -euo pipefail

          CURRENT_CACHE_KEYS=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_KEY" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          CURRENT_CACHE_FOUND=0
          while IFS= read -r CACHE_KEY; do
            if [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ]; then
              CURRENT_CACHE_FOUND=1
              break
            fi
          done <<< "$CURRENT_CACHE_KEYS"

          if [ "$CURRENT_CACHE_FOUND" -ne 1 ]; then
            echo "skip cache rollover: current cache is not available yet"
            exit 0
          fi

          gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" --ref "$GITHUB_REF" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
              [ -n "$CACHE_ID" ] || continue
              [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ] && continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "warning: failed to delete cache $CACHE_ID ($CACHE_KEY)"
            done

# SPDX-License-Identifier: MIT
# AirPi AP3000M 单机型固件（基于主线 main line / kernel 6.18）
#
# 地基：本仓库公用核心 .github/workflows/WRT-CORE.yml（不改动任何原有文件）
# 新增：Config/AP3000M.txt、Scripts/PRIVATE.sh、docs/AP3000M.md、本工作流
#
# 集成插件（Scripts/Packages.sh 已内置克隆，此处只需 CONFIG 选中）：
#   LianXia233/luci-app-fm350                 Fibocom FM350-GL 5G 模组管理（Rust 后端 fm350d）
#   LianXia233/luci-app-airpi3000m-fancontrol AP3000M 风扇温控（LuCI JS + Rust airpi-fanctl + kmod-airpi-gpio-fan）
#
# 说明：ImmortalWrt 源码仓库没有 main 分支，其主线开发分支即 master（内核 6.18）；
#       OpenWrt 上游已把 master 重命名为 main（两者同一提交）。如需直接编 OpenWrt 主线，
#       手动触发时把 SOURCE 填 openwrt/openwrt、BRANCH 填 main 即可。

name: AP3000M

on:
  # 手动编译
  workflow_dispatch:
    inputs:
      SOURCE:
        description: '源码仓库（owner/repo），默认 immortalwrt/immortalwrt'
        required: false
        default: 'immortalwrt/immortalwrt'
        type: string
      BRANCH:
        description: '源码分支，默认 master（主线 6.18；OpenWrt 上游同名分支为 main）'
        required: false
        default: 'master'
        type: string
      PACKAGE:
        description: '手动追加插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

#CI权限
permissions: write-all

#同一时间只跑一个 AP3000M 构建，避免重复占用缓存与 Actions 额度
concurrency:
  group: ap3000m-${{ github.ref }}
  cancel-in-progress: false

#CI任务
jobs:
  ap3000m:
    name: AP3000M-${{ inputs.SOURCE }}-${{ inputs.BRANCH }}
    strategy:
      fail-fast: false
      matrix:
        # 只编 AP3000M 一款，变体在 Config/AP3000M.txt 内调整
        CONFIG: [AP3000M]

    #调用公用编译核心 WRT-CORE.yml（原文件不做任何修改）
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{ matrix.CONFIG }}
      #默认主题
      WRT_THEME: aurora
      #默认主机名
      WRT_NAME: AP3000M
      #默认WIFI名称
      WRT_SSID: AP3000M
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{ inputs.SOURCE || 'immortalwrt/immortalwrt' }}.git
      #源码分支
      WRT_BRANCH: ${{ inputs.BRANCH || 'master' }}
      #源码名称
      WRT_SOURCE: ${{ inputs.SOURCE || 'immortalwrt/immortalwrt' }}
      #插件调整
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      #仅输出配置文件
      WRT_TEST: ${{ inputs.TEST || false }}

  # WRT-CORE 发布时会把 bin/targets 下的全部文件（含 mt798x-bl2 等引导件、manifest）
  # 一并塞进 Release。这里只保留真正要用的两个：sysupgrade 固件 + 本次生效的配置。
  trim-release:
    name: Trim release assets
    needs: ap3000m
    if: ${{ needs.ap3000m.result == 'success' && !inputs.TEST }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Keep only firmware + config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TAG=$(gh api "repos/$GH_REPO/releases?per_page=30" \
            --jq '[.[] | select(.tag_name | startswith("AP3000M-"))][0].tag_name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "no AP3000M release found, skip"
            exit 0
          fi
          echo "release: $TAG"

          gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.assets[].name' |
            while IFS= read -r ASSET; do
              case "$ASSET" in
                *sysupgrade*.bin|Config-*.txt)
                  echo "  keep   $ASSET" ;;
                *)
                  echo "  delete $ASSET"
                  gh release delete-asset "$TAG" "$ASSET" --yes || echo "  warn: delete failed" ;;
              esac
            done

          echo "--- remaining assets ---"
          gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.assets[] | "\(.name)  \(.size) bytes"'

      - name: Rewrite release notes for single-device build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TAG=$(gh api "repos/$GH_REPO/releases?per_page=30" \
            --jq '[.[] | select(.tag_name | startswith("AP3000M-"))][0].tag_name')
          [ -n "$TAG" ] && [ "$TAG" != "null" ] || exit 0

          # 公用核心的通用文案（"平台固件包，内含多个设备"）对单机型构建是错的，去掉这几行
          gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.body' |
            grep -v -F -e '这是个平台固件包' \
                      -e '请注意选择你需要的设备固件' \
                      -e '不要问，刷就完事了' \
                      -e '全系带开源硬件加速' > /tmp/body.txt || true

          {
            echo '**AirPi AP3000M 单机型固件**（`airpi,ap3000m` / MT7981B + MT7976 / eMMC）'
            echo
            echo '本 Release 只包含一款设备的固件，直接下载刷写，无需挑选：'
            echo
            echo '- `*sysupgrade*.bin` —— eMMC 机型 sysupgrade 包（kernel + squashfs）'
            echo '- `Config-*.txt` —— 本次构建实际生效的配置，便于复现'
            echo
            echo '> 本版已内置首次开机自动配置（`/etc/uci-defaults/99-ap3000m-fm350`）：自动纠正 FM350 的 AT 口、APN、数据承载 CID。'
            echo
            cat /tmp/body.txt
          } > /tmp/new-body.txt

          # 注意：GitHub 没有 PATCH /releases/tags/{tag}，改正文必须先拿 release id，否则 404
          RID=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.id')
          gh api -X PATCH "repos/$GH_REPO/releases/$RID" -F body=@/tmp/new-body.txt >/dev/null ||
            echo "warning: release body patch failed (non-fatal)"
          echo "release notes rewritten for $TAG"

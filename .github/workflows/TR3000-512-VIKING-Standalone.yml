name: TR3000-512-VIKING-Standalone

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tr3000-512-viking-standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: firmware
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4

      - name: Clone firmware source
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth 1 --single-branch \
            --branch owrt \
            https://github.com/VIKINGYFY/immortalwrt.git firmware

      - name: Free disk space
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev \
            python3 python3-setuptools python3-pyelftools \
            python3-dev python3-ply python3-docutils \
            rsync swig unzip zlib1g-dev file wget curl \
            ca-certificates ccache subversion \
            autoconf automake libtool pkgconf \
            time xsltproc zstd ecj fastjar java-propose-classpath

      - name: Match running TR3000 512MB partition layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          dts = Path('target/linux/mediatek/dts/mt7981b-cudy-tr3000-v1.dts')
          text = dts.read_text()
          old = 'reg = <0x5c0000 0x4000000>;'
          assert text.count(old) == 1, 'Unexpected upstream UBI layout; review patch'
          text = text.replace(old, 'reg = <0x5c0000 0x1da40000>;')
          text = text.replace('model = "Cudy TR3000 v1";',
                              'model = "Cudy TR3000 512MB v1";')
          dts.write_bytes(text.encode())

          image = Path('target/linux/mediatek/image/filogic.mk')
          text = image.read_text()
          pattern = r'(?ms)^define Device/cudy_tr3000-v1\n.*?^endef$'
          match = re.search(pattern, text)
          assert match, 'Device definition missing'
          block = match.group()
          assert 'IMAGE_SIZE := 65536k' in block, 'Unexpected image size'
          assert 'BLOCKSIZE := 128k' in block
          assert 'PAGESIZE := 2048' in block
          block = block.replace('IMAGE_SIZE := 65536k', 'IMAGE_SIZE := 485632k')
          text = text[:match.start()] + block + text[match.end():]
          image.write_bytes(text.encode())
          PY
          git diff --check
          git diff > tr3000-512.patch
          git rev-parse HEAD > source-commit.txt

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add OpenClash package
        run: |
          git clone --depth 1 --single-branch --branch dev \
            https://github.com/vernesong/OpenClash.git ../openclash-source
          cp -a ../openclash-source/luci-app-openclash package/
          git -C ../openclash-source rev-parse HEAD > openclash-commit.txt

      - name: Configure single device
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-v1=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_usbutils=y
          EOF
          make defconfig
          grep -qx 'CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-v1=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-openclash=y' .config
          grep -qx 'CONFIG_PACKAGE_kmod-usb-net-rndis=y' .config
          grep -qx 'CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y' .config
          cp .config build.config

      - name: Download sources
        run: make download -j8

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log || \
            make -j1 V=s 2>&1 | tee -a build.log

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: tr3000-512-firmware-${{ github.run_number }}
          path: |
            firmware/bin/targets/mediatek/filogic/
            firmware/build.config
            firmware/source-commit.txt
            firmware/openclash-commit.txt
            firmware/tr3000-512.patch
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tr3000-512-diagnostics-${{ github.run_number }}
          path: |
            firmware/build.log
            firmware/.config
            firmware/logs/
            firmware/tr3000-512.patch
          if-no-files-found: ignore
          retention-days: 7

name: TR3000-512-VIKING-Standalone

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tr3000-512-viking-standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      CCACHE_MAXSIZE: 2G
    defaults:
      run:
        working-directory: firmware
    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4

      - name: Clone firmware source
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth 1 --single-branch \
            --branch owrt \
            https://github.com/VIKINGYFY/immortalwrt.git firmware

      - name: Free disk space
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev \
            python3 python3-setuptools python3-pyelftools \
            python3-dev python3-ply python3-docutils \
            rsync swig unzip zlib1g-dev file wget curl \
            ca-certificates ccache subversion \
            autoconf automake libtool pkgconf \
            time xsltproc zstd ecj fastjar java-propose-classpath

      - name: Match running TR3000 512MB partition layout
        shell: bash
        run: bash "$GITHUB_WORKSPACE/Scripts/TR3000-512/patch-layout.sh"

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add OpenClash package
        shell: bash
        run: bash "$GITHUB_WORKSPACE/Scripts/TR3000-512/openclash.sh"

      - name: Add TurboACC nftables interface
        shell: bash
        run: bash "$GITHUB_WORKSPACE/Scripts/TR3000-512/turboacc.sh"

      - name: Add Aurora theme and configuration
        shell: bash
        run: bash "$GITHUB_WORKSPACE/Scripts/TR3000-512/aurora.sh"

      - name: Configure single device
        shell: bash
        run: bash "$GITHUB_WORKSPACE/Scripts/TR3000-512/configure.sh"

      - name: Verify ccache and identify source
        id: cache-source
        run: |
          grep -qx 'CONFIG_CCACHE=y' .config
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore TR3000 build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            firmware/.ccache
            firmware/dl
          key: tr3000-512-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-source.outputs.sha }}-${{ hashFiles('Config/TR3000-512.txt', 'Scripts/TR3000-512/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tr3000-512-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-source.outputs.sha }}-${{ hashFiles('Config/TR3000-512.txt', 'Scripts/TR3000-512/**') }}-
            tr3000-512-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-source.outputs.sha }}-
            tr3000-512-ccache-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Download sources
        run: make download -j8

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log || \
            make -j1 V=s 2>&1 | tee -a build.log

      - name: Show ccache statistics
        if: always()
        run: |
          if [ -x staging_dir/host/bin/ccache ]; then
            CCACHE_DIR="$PWD/.ccache" staging_dir/host/bin/ccache --show-stats
          fi

      - name: Save TR3000 build cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            firmware/.ccache
            firmware/dl
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Verify TR3000 image before publishing
        run: |
          image=bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic-cudy_tr3000-v1-squashfs-sysupgrade.bin
          test -s "$image"
          tar -tf "$image" > /dev/null
          staging_dir/host/bin/fwtool -i tr3000-image-metadata.json "$image"
          python3 "$GITHUB_WORKSPACE/Scripts/TR3000-512/verify-build.py" \
            --config .config \
            --manifest bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic-cudy_tr3000-v1.manifest \
            --metadata tr3000-image-metadata.json

      - name: Publish TR3000 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          image=bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic-cudy_tr3000-v1-squashfs-sysupgrade.bin
          test -s "$image"
          cp "$image" release-assets/
          (cd release-assets && sha256sum immortalwrt-mediatek-filogic-cudy_tr3000-v1-squashfs-sysupgrade.bin > sha256sums)
          python3 "$GITHUB_WORKSPACE/Scripts/TR3000-512/publish.py" \
            --model tr3000-512 --label 'TR3000 512MB' \
            --source https://github.com/VIKINGYFY/immortalwrt --branch owrt \
            --commit "$(cat source-commit.txt)" \
            --notes "$GITHUB_WORKSPACE/release-notes/TR3000-512.md" --assets release-assets

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tr3000-512-diagnostics-${{ github.run_number }}
          path: |
            firmware/build.log
            firmware/build.config
            firmware/logs/
            firmware/tr3000-512.patch
            firmware/tr3000-image-metadata.json
            firmware/bin/targets/mediatek/filogic/*cudy_tr3000-v1.manifest
          if-no-files-found: ignore
          retention-days: 7

# Publish the exact successful device artifact without recompiling or moving its tag.
name: Publish existing device artifact
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Completed main device run with successful validated firmware artifact'
        required: true
        type: string
      artifact_id:
        description: 'Optional exact artifact ID when several build attempts uploaded firmware'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: device-release-recovery-${{ inputs.run_id }}
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      SOURCE_RUN: ${{inputs.run_id}}
    steps:
    - name: Checkout trusted release verification
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        sparse-checkout: .github/scripts
    - name: Verify and bind the archived firmware to its original build
      id: source
      env:
        SOURCE_ARTIFACT: ${{inputs.artifact_id}}
      run: python3 .github/scripts/release-evidence.py select
    - name: Require successful build logic checks for the built commit
      env:
        GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      run: python3 .github/scripts/release-evidence.py logic
    - name: Refuse overwriting any existing release
      env:
        GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        RELEASE_TAG: ${{steps.source.outputs.tag}}
      run: python3 .github/scripts/release-evidence.py new
    - name: Verify or create exact release tag
      env:
        GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        RELEASE_TAG: ${{steps.source.outputs.tag}}
        FIRMWARE_TAG_TOKEN: ${{secrets.FIRMWARE_TAG_TOKEN}}
      run: python3 .github/scripts/release-evidence.py tag --create-tag
    - name: Mark pipeline draft ownership
      env:
        RELEASE_TAG: ${{steps.source.outputs.tag}}
      run: |
        printf '\n<!-- firmware-ci: repo=%s run=%s attempt=%s sha=%s tag=%s started=%s -->\n' \
          "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$BUILD_SHA" \
          "$RELEASE_TAG" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> ./release/build-reports/release-notes.md
    - name: Create validated draft
      id: release
      env:
        GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        RELEASE_TAG: ${{steps.source.outputs.tag}}
      run: python3 .github/scripts/release-evidence.py draft
    - name: Verify uploaded release asset digests
      env:
        GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        RELEASE_TAG: ${{steps.source.outputs.tag}}
        RELEASE_ID: ${{steps.release.outputs.id}}
      run: python3 .github/scripts/release-evidence.py uploaded
    - name: Publish complete release
      env:
        GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        RELEASE_TAG: ${{steps.source.outputs.tag}}
        RELEASE_ID: ${{steps.release.outputs.id}}
      run: python3 .github/scripts/release-evidence.py publish
    - name: Remove this run's failed draft
      if: ${{ failure() || cancelled() }}
      env:
        GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        RELEASE_TAG: ${{steps.source.outputs.tag}}
      run: |
        # Draft creation can succeed before attachment upload finishes.
        # Match this exact run/attempt; never delete a published or manual draft.
        gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
        marker="<!-- firmware-ci: repo=$GITHUB_REPOSITORY run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT sha=$BUILD_SHA tag=$RELEASE_TAG started="
        id=$(jq -r --arg tag "$RELEASE_TAG" --arg marker "$marker" \
          '[.[][] | select(.draft == true and .tag_name == $tag and ((.body // "") | contains($marker)))]
           | if length == 1 then .[0].id else empty end' releases.json)
        if [ -n "$id" ]; then
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" > draft.json
          if jq -e --arg tag "$RELEASE_TAG" --arg marker "$marker" \
            '.draft == true and .tag_name == $tag and ((.body // "") | contains($marker))' draft.json >/dev/null; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          fi
        fi
